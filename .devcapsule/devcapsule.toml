devcapsule-schema-version = 1

[capabilities]
need = ["claude-code-agent", "docker-cli", "node", "python", "python-ide"]

[project]
name = "DevCapsule Sample: FastAPI TODO Web App"
slug = "devcapsule-sample-fastapi-webbapp"
creator = "https://github.com/ccozianu"
mount = "/workspace/fastapi-webbapp"

[configuration.values."database.url"]
type = "string"
description = "SQLAlchemy URL for the TODO database. Defaults to the local development PostgreSQL started from docker-compose.yml."

[host.docker.mode.recommended]
value = "host-socket"
justification = "This sample starts its own PostgreSQL with the Docker CLI. Skip it if you already run PostgreSQL on the host and point database.url at that server instead."
enables = ["local-postgresql-database"]

[host.network.mode.recommended]
value = "host"
justification = "Deliberate V1 simplifying assumption: host networking lets the backend reach PostgreSQL and lets a host browser open the dev servers without per-port plumbing. developer-readme.md documents how to run with tighter networking instead."
enables = ["local-postgresql-database", "browser-access-to-dev-servers"]
