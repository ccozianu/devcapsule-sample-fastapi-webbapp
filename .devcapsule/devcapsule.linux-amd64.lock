devcapsule-lock-format-version = 1
resolution-matrix-version = "dogfood-v1"
manifest-digest = "dd4ea2bb4f312da9f4bb060c5a4ca8684b8218c0431b08565ace6142572c46ab"
platform = "linux-amd64"

[base]
# Published DevCapsule base pinned by digest rather than by a mutable tag. The
# base provides Python, Node.js, npm, Git, the Docker CLI, and — from recipe 5 —
# the PostgreSQL client this sample declares below.
reference = "docker.io/mycodespaceai/devcapsule-base@sha256:a9f00250515b757d8e9d8ad832d9cab09a9a6e000f630651704e8538a4702998"

[components]
interactive-surface = "pycharm"

[components.pycharm]
version = "2026.2.0.1"
variant = "professional"
delivery-policy = "local-materialization"
url = "https://download.jetbrains.com/python/pycharm-2026.2.0.1.tar.gz"
sha256 = "4a37cb2d15703553c61e814d8e014bfa47308508470de5f968c4e9645b771675"

[components.claude-code]
version = "2.1.227"
delivery-policy = "local-materialization"
acquisition-authorization = "claude-code-download"
license = "Proprietary"
terms-url = "https://www.anthropic.com/legal/commercial-terms"
distribution = "user-acquired-not-redistributed"

[components.claude-code.artifacts.linux-amd64]
url = "https://downloads.claude.ai/claude-code-releases/2.1.227/linux-x64/claude"
sha256 = "6832dc3f1797b890b71116e5f2dbbf9a83fd3d0498c235b4b0f9cd0e6e499ad6"

[components.postgresql-client]
# Redistributable under the PostgreSQL License, so the pinned base carries it
# and nothing is downloaded during local materialization.
version = "16"
delivery-policy = "base-image"
license = "PostgreSQL"

[materialization]
recipe = "jetbrains-local-materialization"
recipe-version = "1"
